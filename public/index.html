<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparky Herofy Photobooth</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-glow"></div>
    <h1>sparky herofy photobooth</h1>
  </header>

  <main class="grid-container">
    <section class="quad" data-folder="1">
      <div class="quad-frame">
        <img class="slide current" alt="Slideshow quadrant 1" />
        <div class="quad-label">Booth 1</div>
        <div class="placeholder">Add images to folder1</div>
      </div>
    </section>
    <section class="quad" data-folder="2">
      <div class="quad-frame">
        <img class="slide current" alt="Slideshow quadrant 2" />
        <div class="quad-label">Booth 2</div>
        <div class="placeholder">Add images to folder2</div>
      </div>
    </section>
    <section class="quad" data-folder="3">
      <div class="quad-frame">
        <img class="slide current" alt="Slideshow quadrant 3" />
        <div class="quad-label">Booth 3</div>
        <div class="placeholder">Add images to folder3</div>
      </div>
    </section>
    <section class="quad" data-folder="4">
      <div class="quad-frame">
        <img class="slide current" alt="Slideshow quadrant 4" />
        <div class="quad-label">Booth 4</div>
        <div class="placeholder">Add images to folder4</div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
